<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#050b24; --navy2:#0b1640; --blue:#1d4ed8; --sky:#5aa8ff;
  --gold:#f5c96a; --gold2:#d99a2b; --cream:#fdf6e6; --text:#eef2ff; --muted:#9fb0d9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Heebo,system-ui,sans-serif;background:var(--navy);color:var(--text);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.hidden{display:none!important}
.gold{background:linear-gradient(180deg,#fff3c9 0%,var(--gold) 45%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.title{font-family:"Secular One",Heebo,sans-serif}

/* רקע במה */
.stage-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,#1b3aa8 0%,transparent 55%),radial-gradient(ellipse at 50% -10%,#14286e 0%,var(--navy) 60%)}
.beam{position:absolute;top:-10%;width:18vw;height:130%;transform-origin:top center;
  background:linear-gradient(180deg,rgba(120,180,255,.35),rgba(120,180,255,0) 75%);filter:blur(6px);animation:sway 7s ease-in-out infinite alternate}
.beam.g{background:linear-gradient(180deg,rgba(255,205,120,.32),rgba(255,205,120,0) 70%)}
@keyframes sway{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) * -0.4))}}
.floor{position:absolute;bottom:0;left:0;right:0;height:22vh;background:linear-gradient(180deg,transparent,rgba(40,90,255,.18));border-top:1px solid rgba(120,170,255,.25)}

/* ===== טלפון ===== */
.phone{max-width:520px;margin:0 auto;min-height:100%;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.logo{width:100%;border-radius:18px;display:block;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card{background:rgba(10,20,60,.72);border:1px solid rgba(245,201,106,.35);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.card h2{font-size:22px;margin-bottom:10px}
.muted{color:var(--muted)}
.btn{background:linear-gradient(180deg,#ffe6a6,var(--gold) 50%,var(--gold2));color:#2a1a00;font-weight:800;font-size:18px;padding:14px 18px;border-radius:14px;width:100%;box-shadow:0 4px 0 #8a5c12}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5c12}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.btn.small{font-size:15px;padding:10px 12px;width:auto}
.btn.blue{background:linear-gradient(180deg,#6fb0ff,#2563eb);color:#fff;box-shadow:0 4px 0 #173f9e}
.btn.red{background:linear-gradient(180deg,#ff8a8a,#d33);color:#fff;box-shadow:0 4px 0 #8b1d1d}
.btn:disabled{opacity:.4}
.famlist{display:grid;gap:8px}
.famopt{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.12);padding:14px;border-radius:12px;font-size:17px;text-align:right}
.famopt.sel{border-color:var(--gold);background:rgba(245,201,106,.15)}
.pin{width:100%;font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border-radius:12px;border:1px solid rgba(245,201,106,.5);background:rgba(0,0,0,.35);color:#fff;direction:ltr}
.err{color:#ff9b9b;min-height:22px;margin-top:6px}
.now-label{font-size:15px;color:var(--gold);letter-spacing:1px}
.now-name{font-size:32px;font-weight:900;line-height:1.15;margin:4px 0}
.now-song{font-size:18px;color:var(--muted)}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.score{aspect-ratio:1;border-radius:50%;font-size:44px;font-weight:900;color:#2a1a00;
  background:radial-gradient(circle at 35% 30%,#fff8dc,var(--gold) 45%,var(--gold2));border:4px solid #fff3c9;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.score.sel{outline:5px solid #6fb0ff;outline-offset:3px;transform:scale(1.06)}
.score .lbl{display:block;font-size:13px;font-weight:700}
.done-check{font-size:60px;text-align:center}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:14px}

/* ===== מסך גדול ===== */
.screen{height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3vh 4vw;overflow:hidden;position:relative}
.screen .slogo{width:min(46vw,760px);border-radius:2vw;box-shadow:0 2vh 6vh rgba(0,0,0,.6)}
.s-big{font-size:clamp(40px,8vw,140px);font-weight:900;line-height:1.05}
.s-mid{font-size:clamp(22px,3.4vw,58px);font-weight:700}
.s-small{font-size:clamp(16px,1.8vw,30px);color:var(--muted)}
.s-tag{display:inline-block;padding:.4vh 2vw;border:2px solid var(--gold);border-radius:999px;color:var(--gold);font-size:clamp(16px,2vw,34px);letter-spacing:2px;margin-bottom:2vh}
.lineup{display:flex;flex-wrap:wrap;justify-content:center;gap:1vh 1vw;margin-top:3vh;max-width:90vw}
.lineup span{padding:.8vh 1.4vw;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);font-size:clamp(14px,1.5vw,26px)}
.lineup span.done{opacity:.4;text-decoration:line-through}
.lineup span.cur{border-color:var(--gold);color:var(--gold);background:rgba(245,201,106,.12)}
.qrbox{position:absolute;bottom:3vh;left:3vw;background:#fff;padding:10px;border-radius:12px;text-align:center;color:#0b1640;font-weight:700;font-size:clamp(12px,1.1vw,18px)}
.qrbox #qr img,.qrbox #qr canvas{width:min(13vw,180px)!important;height:auto!important}
.dots{display:flex;gap:1vw;justify-content:center;margin-top:4vh;flex-wrap:wrap}
.dot{width:clamp(18px,2.4vw,40px);height:clamp(18px,2.4vw,40px);border-radius:50%;border:2px solid var(--gold);transition:.4s}
.dot.on{background:var(--gold);box-shadow:0 0 18px var(--gold)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55;transform:scale(.97)}}
.mic{font-size:clamp(40px,7vw,120px)}
.drum{font-size:clamp(80px,18vw,320px);font-weight:900}
.winner-wrap{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.prize{display:inline-block;margin-top:3vh;padding:1.2vh 3vw;border-radius:999px;background:linear-gradient(180deg,#ffe6a6,var(--gold) 50%,var(--gold2));color:#2a1a00;font-weight:900;font-size:clamp(22px,3.4vw,60px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
.corner-btn{position:fixed;top:10px;left:10px;opacity:.15;background:none;color:#fff;font-size:14px}
.corner-btn:hover{opacity:.8}

/* ===== ניהול ===== */
.admin .card{padding:16px}
.state-pill{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(90,168,255,.18);color:#bfe0ff;font-weight:700;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.fam-admin{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;display:grid;gap:8px}
.fam-admin.cur{border-color:var(--gold)}
.fam-admin.done{opacity:.6}
.fam-admin input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:15px}
.iconbtn{background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
.codechip{direction:ltr;font-weight:800;color:var(--gold);letter-spacing:2px}
.vote-status{display:flex;flex-wrap:wrap;gap:6px}
.vote-status span{padding:4px 10px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.07)}
.vote-status span.yes{background:rgba(80,200,120,.25);color:#b6f5c9}
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res td,table.res th{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.1);text-align:right}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111a3d;border:1px solid var(--gold);padding:10px 18px;border-radius:12px;z-index:50;transition:.3s}
.demo-banner{background:#5b3d00;color:#ffe2a3;text-align:center;font-size:13px;padding:6px}
</style>
</head>

const Store = (() => {
  let tree = {}, lastJSON = "", mode = "loading"; const subs = [];
  const emit = force => { const j = JSON.stringify(tree); if (!force && j === lastJSON) return; lastJSON = j; subs.forEach(f => f(tree)); };
  const LSget = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  /* --- מצב הדגמה: הכול נשמר בדפדפן --- */
  const KEY = "kochav-demo";
  const dLoad = () => { try { tree = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { tree = {}; } };
  const dSave = () => { try { localStorage.setItem(KEY, JSON.stringify(tree)); } catch (e) {} emit(); };
  const walk = (p, create) => { const parts = p.split("/"); let o = tree; for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null || typeof o[parts[i]] !== "object") { if (!create) return [null]; o[parts[i]] = {}; } o = o[parts[i]]; } return [o, parts[parts.length - 1]]; };
  const dSet = (p, v) => { const [o, k] = walk(p, true); if (v === null || v === undefined) delete o[k]; else o[k] = JSON.parse(JSON.stringify(v)); };
  const dWinners = () => { const r = ranking(tree).filter(x => x.count); return r.length ? r.filter(x => Math.abs(x.avg - r[0].avg) < 1e-9).map(x => x.name) : []; };

  /* --- מצב שרת --- */
  const headers = () => {
    const h = {};
    if ((location.hash || "") === "#admin" && LSget("kochav-admin")) h["x-admin-pin"] = LSget("kochav-admin");
    if (LSget("kochav-family")) { h["x-family"] = LSget("kochav-family"); h["x-code"] = LSget("kochav-code") || ""; }
    return h;
  };
  async function pull(){
    const r = await fetch(API, { headers: headers(), cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json(); if (!j || typeof j !== "object" || j.error) throw new Error("bad");
    tree = j; emit();
  }
  async function post(body){
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "שגיאה");
    pull().catch(() => {});
    return j;
  }

  const api = {
    get: () => tree,
    on: f => subs.push(f),
    get demo(){ return mode === "demo"; },
    get ready(){ return mode !== "loading"; },
    refresh: () => mode === "server" ? pull().catch(() => {}) : (dLoad(), emit(true)),
    async login(fam, code){
      if (mode === "demo") { const f = (tree.families || {})[fam]; return !!(f && String(f.code) === String(code)); }
      return (await post({ action: "login", fam, code })).ok;
    },
    async checkAdmin(pin){
      if (mode === "demo") return pin === DEMO_ADMIN_PIN;
      const r = await fetch(API, { headers: { "x-admin-pin": pin }, cache: "no-store" }); const j = await r.json().catch(() => ({}));
      return !!j.admin;
    },
    async vote(perf, score){
      const fam = LSget("kochav-family"), code = LSget("kochav-code");
      if (mode === "demo") { const st = tree.state || {}; if (st.phase !== "voting" || st.current !== perf) throw new Error("ההצבעה סגורה"); dSet(`votes/${perf}/${fam}`, score); return dSave(); }
      return post({ action: "vote", fam, code, perf, score });
    },
    async set(p, v){ if (mode === "demo") { dSet(p, v); syncWinners(); return dSave(); } return post({ action: "admin", pin: LSget("kochav-admin"), op: "set", path: p, value: v }); },
    async update(p, v){ if (mode === "demo") { Object.keys(v).forEach(k => dSet(p + "/" + k, v[k])); syncWinners(); return dSave(); } return post({ action: "admin", pin: LSget("kochav-admin"), op: "update", path: p, value: v }); },
    async remove(p){ if (mode === "demo") { dSet(p, null); syncWinners(); return dSave(); } return post({ action: "admin", pin: LSget("kochav-admin"), op: "remove", path: p }); }
  };
  function syncWinners(){ if ((tree.state || {}).phase === "reveal") tree.winners = dWinners(); else delete tree.winners; }

  (async () => {
    try { if (location.protocol === "file:") throw 0; await pull(); mode = "server"; emit(true);
      let fails = 0;
      setInterval(() => { if (document.hidden) return; pull().then(() => fails = 0, () => { if (++fails === 3) toast("אין חיבור לשרת, מנסה שוב…"); }); }, POLL_MS);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) pull().catch(() => {}); });
    } catch (e) {
      mode = "demo"; dLoad(); emit(true);
      window.addEventListener("storage", ev => { if (ev.key === KEY) { dLoad(); emit(); } });
    }
  })();
  return api;
})();

/* ===================== עזרים ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), 2200); }
function families(tree){ const f = tree.families || {}; return Object.keys(f).map(id => ({ id, ...f[id] })).sort((a, b) => (a.order ?? 999) - (b.order ?? 999)); }
function state(tree){ return Object.assign({ phase: "lobby", current: null }, tree.state || {}); }
function votesFor(tree, pid){ return (tree.votes && tree.votes[pid]) || {}; }
function randCode(used){ let c; do { c = String(Math.floor(1000 + Math.random() * 9000)); } while (used.has(c)); return c; }
function ranking(tree){
  const fams = families(tree);
  return fams.map(f => {
    const v = Object.values(votesFor(tree, f.id)).map(Number).filter(n => n);
    const total = v.reduce((a, b) => a + b, 0);
    return { ...f, total, count: v.length, avg: v.length ? total / v.length : 0 };
  }).sort((a, b) => b.avg - a.avg || b.total - a.total);
}
function winners(tree){
  if (Array.isArray(tree.winners)) return tree.winners.map(name => ({ name }));
  const r = ranking(tree).filter(x => x.count > 0);
  if (!r.length) return [];
  const top = r[0].avg;
  return r.filter(x => Math.abs(x.avg - top) < 1e-9);
}
function joinNames(arr){ if (arr.length <= 1) return arr.join(""); return arr.slice(0, -1).join(", ") + " ו" + arr[arr.length - 1]; }

(function beams(){
  const bg = $("#stagebg"); const angles = [-28, -14, 0, 14, 28];
  angles.forEach((a, i) => { const b = document.createElement("div"); b.className = "beam" + (i % 2 ? " g" : ""); b.style.left = (8 + i * 19) + "%"; b.style.setProperty("--a", a + "deg"); b.style.animationDelay = (i * -1.3) + "s"; bg.appendChild(b); });
  const f = document.createElement("div"); f.className = "floor"; bg.appendChild(f);
})();

/* ===================== ניתוב ===================== */
function route(){ return (location.hash || "#vote").slice(1); }
let current = null;
function render(){
  const tree = Store.get(); const r = route();
  $("#demoBanner").classList.toggle("hidden", !Store.demo || r === "screen");
  if (!Store.ready) { $("#app").innerHTML = `<div class="phone"><img class="logo" src="${LOGO}"><p class="muted" style="text-align:center">טוען…</p></div>`; return; }
  if (r === "screen") Screen.render(tree);
  else if (r === "admin") Admin.render(tree);
  else Phone.render(tree);
}
Store.on(render);
window.addEventListener("hashchange", () => { Screen.reset(); render(); });

/* ===================== טלפון: הצבעה ===================== */
const Phone = {
  pick: null, choice: null,
  me(tree){ const id = LS.get("kochav-family"); const f = tree.families && tree.families[id]; return f ? { id, ...f } : null; },
  render(tree){
    const app = $("#app"); const me = this.me(tree); const st = state(tree); const fams = families(tree);
    let h = `<div class="phone"><img class="logo" src="${LOGO}" alt="הכוכב הבא של משפחת חזן">`;
    if (!me) {
      h += `<div class="card"><h2 class="gold title">מי אתם?</h2><p class="muted" style="margin-bottom:12px">בחרו את המשפחה שלכם והקלידו את הקוד שקיבלתם</p>`;
      if (!fams.length) h += `<p class="muted">עוד רגע מתחילים…</p>`;
      h += `<div class="famlist">` + fams.map(f => `<button class="famopt ${this.pick === f.id ? "sel" : ""}" data-pick="${f.id}">${esc(f.name)}</button>`).join("") + `</div>`;
      if (this.pick) h += `<div style="margin-top:14px"><input id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="••••" value="${esc(this.pinVal || "")}"><div class="err" id="pinErr">${esc(this.pinErr || "")}</div><button class="btn" id="login">כניסה</button></div>`;

      app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { this.pick = b.dataset.pick; this.pinVal = ""; this.pinErr = ""; this.render(Store.get()); setTimeout(() => $("#pin")?.focus(), 50); });
      const pin = $("#pin"); if (pin) { pin.oninput = () => this.pinVal = pin.value; pin.onkeydown = e => { if (e.key === "Enter") $("#login").click(); }; }
      const lg = $("#login"); if (lg) lg.onclick = async () => {
        const v = $("#pin").value.trim(); lg.disabled = true;
        let ok = false; try { ok = await Store.login(this.pick, v); } catch (e) {}
        if (ok) { LS.set("kochav-family", this.pick); LS.set("kochav-code", v); this.pinVal = ""; this.pinErr = ""; Store.refresh(); this.render(Store.get()); }
        else { this.pinErr = "הקוד לא נכון, נסו שוב"; this.render(Store.get()); }
      };
      return;
    }
    const cur = st.current && tree.families && tree.families[st.current] ? { id: st.current, ...tree.families[st.current] } : null;
    h += `<div class="card">`;
    if (st.phase === "voting" && cur) {
      if (cur.id === me.id) {
        h += `<div class="now-label">ההופעה שלכם!</div><div class="now-name gold title">${esc(cur.name)}</div><p class="muted">את עצמכם לא מדרגים. שאר המשפחות מצביעות עכשיו.</p>`;
      } else {
        const mine = votesFor(tree, cur.id)[me.id];
        h += `<div class="now-label">ההצבעה פתוחה</div><div class="now-name gold title">${esc(cur.name)}</div>${cur.song ? `<div class="now-song">${esc(cur.song)}</div>` : ""}
          <p style="margin-top:14px">כמה נקודות אתם נותנים?</p>
          <div class="scores">${[1,3,5].map(n => `<button class="score ${Number(mine) === n ? "sel" : ""}" data-s="${n}">${n}<span class="lbl">${n === 5 ? "וואו!" : n === 3 ? "יפה" : "חמוד"}</span></button>`).join("")}</div>
          <p class="muted" style="margin-top:12px;text-align:center">${mine ? "ההצבעה נקלטה ✓ אפשר לשנות עד שסוגרים" : "ההצבעה סודית"}</p>`;
      }
    } else if (st.phase === "performing" && cur) {
      h += `<div class="now-label">עכשיו על הבמה</div><div class="now-name gold title">${esc(cur.name)}</div>${cur.song ? `<div class="now-song">${esc(cur.song)}</div>` : ""}<p class="muted" style="margin-top:10px">${cur.id === me.id ? "בהצלחה! 🎤" : "ההצבעה תיפתח בסוף השיר"}</p>`;
    } else if (st.phase === "closed" && cur) {
      h += `<div class="done-check">🎶</div><p style="text-align:center">ההצבעה על ${esc(cur.name)} נסגרה.<br><span class="muted">מחכים להופעה הבאה…</span></p>`;
    } else if (st.phase === "final" || st.phase === "reveal") {
      h += `<div class="done-check">⭐</div><p style="text-align:center;font-size:20px">כל המשפחות הופיעו!<br><span class="muted">תסתכלו על המסך הגדול…</span></p>`;
    } else {
      h += `<div class="now-label">שלום ${esc(me.name)}</div><p style="margin-top:8px">התחרות עוד לא התחילה. כשמשפחה תסיים לשיר, ההצבעה תיפתח כאן.</p>`;
    }
    h += `</div><div class="foot"><span class="muted">מחוברים בתור ${esc(me.name)}</span><button class="link" id="logout">החלפת משפחה</button></div></div>`;
    app.innerHTML = h;
    $("#logout").onclick = () => { LS.del("kochav-family"); LS.del("kochav-code"); this.pick = null; this.render(Store.get()); };
    app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      const t = Store.get(); const s = state(t);
      if (s.phase !== "voting" || s.current !== cur.id) return toast("ההצבעה כבר נסגרה");
      app.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("sel", x === b));
      Store.vote(cur.id, Number(b.dataset.s)).then(() => { if (navigator.vibrate) navigator.vibrate(30); }, e => toast(e.message || "ההצבעה לא נקלטה, נסו שוב"));
    });
  }
};

/* ===================== מסך גדול ===================== */
const Screen = {
  lastKey: null, revealTimer: null, qrDone: false,
  reset(){ this.lastKey = null; clearInterval(this.revealTimer); this.revealTimer = null; this.qrDone = false; stopConfetti(); },
  render(tree){
    const st = state(tree); const fams = families(tree); const app = $("#app");
    const cur = st.current && tree.families && tree.families[st.current] ? { id: st.current, ...tree.families[st.current] } : null;
    const doneSet = new Set(Object.keys(tree.done || {}));
    // מפתח למניעת ציור מחדש מיותר (חשוב לאנימציות)
    const voted = cur ? Object.keys(votesFor(tree, cur.id)).length : 0;
    const key = JSON.stringify([st.phase, st.current, st.revealAt, fams.map(f => [f.name, f.song, doneSet.has(f.id)]), st.phase === "voting" ? voted : 0]);
    if (key === this.lastKey) return; this.lastKey = key;
    const corner = `<button class="corner-btn" onclick="document.documentElement.requestFullscreen?.()">מסך מלא</button>`;
    const lineup = `<div class="lineup">${fams.map(f => `<span class="${f.id === st.current ? "cur" : doneSet.has(f.id) ? "done" : ""}">${esc(f.name)}</span>`).join("")}</div>`;
    stopConfetti();
    if (st.phase === "lobby" || !cur && st.phase !== "final" && st.phase !== "reveal") {
      app.innerHTML = `<div class="screen" style="background:linear-gradient(180deg,rgba(5,11,36,.2),rgba(5,11,36,.95)),url(${HERO}) center top/cover">${corner}
        <img class="slogo" src="${LOGO}"><div class="s-mid gold title" style="margin-top:4vh">ערב חנוכה • תחרות השירה</div>
        <div class="s-small" style="margin-top:1vh">סורקים את הקוד, נכנסים עם קוד המשפחה ומחכים להצבעה</div>${lineup}
        <div class="qrbox"><div id="qr"></div>סרקו להצבעה</div></div>`;
      this.drawQR();
    } else if (st.phase === "performing") {
      const idx = fams.findIndex(f => f.id === cur.id); const next = fams.slice(idx + 1).find(f => !doneSet.has(f.id));
      app.innerHTML = `<div class="screen">${corner}<div class="s-tag">עכשיו על הבמה</div><div class="mic">🎤</div>
        <div class="s-big gold title winner-wrap">${esc(cur.name)}</div>${cur.song ? `<div class="s-mid" style="margin-top:2vh">${esc(cur.song)}</div>` : ""}
        ${next ? `<div class="s-small" style="position:absolute;bottom:4vh">הבאים בתור: ${esc(next.name)}</div>` : ""}</div>`;
    } else if (st.phase === "voting") {
      const eligible = fams.filter(f => f.id !== cur.id).length;
      app.innerHTML = `<div class="screen">${corner}<div class="s-tag pulse">ההצבעה פתוחה</div>
        <div class="s-mid">כמה נקודות מגיעות ל…</div><div class="s-big gold title">${esc(cur.name)}</div>
        <div class="s-small" style="margin-top:2vh">מצביעים בטלפון: 1, 3 או 5</div>
        <div class="dots">${Array.from({ length: eligible }, (_, i) => `<div class="dot ${i < voted ? "on" : ""}"></div>`).join("")}</div>
        <div class="s-small" style="margin-top:1.5vh">${voted} מתוך ${eligible} משפחות הצביעו</div></div>`;
    } else if (st.phase === "closed") {
      app.innerHTML = `<div class="screen">${corner}<div class="s-mid">כל הכבוד ל</div><div class="s-big gold title">${esc(cur.name)}!</div>
        <div class="s-small" style="margin-top:2vh">ההצבעה נסגרה. מחכים להופעה הבאה…</div>${lineup}</div>`;
    } else if (st.phase === "final") {
      app.innerHTML = `<div class="screen">${corner}<img class="slogo" src="${LOGO}" style="width:min(34vw,560px)">
        <div class="s-big gold title" style="margin-top:4vh">כל המשפחות הופיעו!</div><div class="s-mid pulse" style="margin-top:2vh">ומי הכוכב הבא?</div>${lineup}</div>`;
    } else if (st.phase === "reveal") {
      const w = winners(tree);
      const showWinner = () => {
        const names = w.map(x => x.name);
        app.innerHTML = `<div class="screen">${corner}<div class="s-tag">${names.length > 1 ? "הכוכבים הבאים" : "הכוכב הבא"}</div>
          <div class="winner-wrap"><div style="font-size:clamp(50px,9vw,160px)">⭐</div><div class="s-big gold title">${esc(joinNames(names)) || "—"}</div>
          <div class="prize">${names.length > 1 ? "חולקים את" : "זוכים ב-"}${names.length > 1 ? " " : ""}${PRIZE}</div></div>
          <div class="s-small" style="position:absolute;bottom:4vh">כל הכבוד לכל המשפחות שעלו לבמה! חנוכה שמח 🕎</div></div>`;
        startConfetti();
      };
      const elapsed = Date.now() - (st.revealAt || 0);
      if (elapsed > 9000) return showWinner();
      let n = Math.max(1, 5 - Math.floor(elapsed / 1000));
      app.innerHTML = `<div class="screen">${corner}<div class="s-mid">והזוכים בתחרות הם…</div><div class="drum gold title" id="drum">${n}</div><div class="mic">🥁</div></div>`;
      clearInterval(this.revealTimer);
      this.revealTimer = setInterval(() => { n--; if (n <= 0) { clearInterval(this.revealTimer); showWinner(); } else { const d = $("#drum"); if (d) d.textContent = n; } }, 1000);
    }
  },
  drawQR(){
    const box = $("#qr"); if (!box || !window.QRCode) return;
    const url = location.href.split("#")[0] + "#vote";
    try { new QRCode(box, { text: url, width: 360, height: 360, colorDark: "#0b1640", colorLight: "#ffffff" }); } catch (e) {}
  }
};

/* ===================== ניהול ===================== */
const Admin = {
  showResults: false, editing: null,
  render(tree){
    const app = $("#app");
    if (!LS.get("kochav-admin") || (!Store.demo && !tree.admin) || (Store.demo && LS.get("kochav-admin") !== DEMO_ADMIN_PIN)) {
      if (LS.get("kochav-admin") && !Store.demo && !this.checked) { this.checked = true; Store.refresh(); app.innerHTML = `<div class="phone"><p class="muted">טוען…</p></div>`; return; }
      app.innerHTML = `<div class="phone admin"><img class="logo" src="${LOGO}"><div class="card"><h2 class="gold title">כניסת מנהל</h2>
        <input id="apin" class="pin" inputmode="numeric" maxlength="8" placeholder="קוד"><div class="err" id="aerr"></div><button class="btn" id="alogin">כניסה</button></div></div>`;
      $("#alogin").onclick = async () => { const v = $("#apin").value.trim(); if (await Store.checkAdmin(v).catch(() => false)) { LS.set("kochav-admin", v); this.checked = false; Store.refresh(); } else $("#aerr").textContent = "קוד שגוי"; };
      return;
    }
    // אם עורכים שדה, לא מציירים מחדש כדי לא לאבד את מה שמקלידים
    if (this.editing && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.edit) return;
    const fams = families(tree); const st = state(tree); const doneSet = new Set(Object.keys(tree.done || {}));
    if (!fams.length && !this.seeded) { this.seeded = true; this.seed(); return; }
    const cur = st.current && tree.families && tree.families[st.current] ? { id: st.current, ...tree.families[st.current] } : null;
    const nextUp = fams.find(f => !doneSet.has(f.id) && f.id !== st.current);
    const phaseName = { lobby: "לפני התחלה", performing: "שרים עכשיו", voting: "הצבעה פתוחה", closed: "הצבעה נסגרה", final: "כולם הופיעו", reveal: "הזוכה נחשף" }[st.phase] || st.phase;
    const base = location.href.split("#")[0];
    let h = `<div class="phone admin"><div class="row" style="justify-content:space-between"><h2 class="gold title" style="font-size:26px">ניהול התחרות</h2><span class="state-pill">${phaseName}</span></div>`;

    // לוח בקרה
    h += `<div class="card"><div class="now-label">על הבמה</div><div class="now-name" style="font-size:24px">${cur ? esc(cur.name) : "אף אחד עדיין"}</div>${cur && cur.song ? `<div class="now-song">${esc(cur.song)}</div>` : ""}<div style="display:grid;gap:10px;margin-top:14px">`;
    if (st.phase === "performing") h += `<button class="btn blue" data-act="open">השיר נגמר: פתח הצבעה</button>`;
    if (st.phase === "voting") {
      const vs = votesFor(tree, cur.id);
      h += `<div class="vote-status">${fams.filter(f => f.id !== cur.id).map(f => `<span class="${vs[f.id] ? "yes" : ""}">${esc(f.name.replace("משפחת ", ""))}</span>`).join("")}</div>
        <button class="btn blue" data-act="close">סגור הצבעה (${Object.keys(vs).length}/${fams.length - 1})</button>`;
    }
    if (st.phase === "lobby" || st.phase === "closed") {
      if (nextUp) h += `<button class="btn" data-act="next">${st.phase === "lobby" ? "מתחילים! " : ""}על הבמה: ${esc(nextUp.name)}</button>`;
      else if (fams.length) h += `<button class="btn" data-act="final">כולם הופיעו: עבור לגמר</button>`;
    }
    if (st.phase === "final") {
      const w = winners(tree);
      if (w.length > 1) h += `<p class="err">שימו לב: יש תיקו בין ${esc(joinNames(w.map(x => x.name)))}. בחשיפה שניהם יוצגו כזוכים. אפשר לבדוק בתוצאות למטה.</p>`;
      h += `<button class="btn" data-act="reveal">🥁 חשיפת הזוכה</button><button class="btn ghost" data-act="back">חזרה להופעות</button>`;
    }
    if (st.phase === "reveal") h += `<button class="btn ghost" data-act="unreveal">הסתר שוב (חזרה לגמר)</button>`;
    h += `</div></div>`;

    // קישורים
    h += `<div class="card"><h2 style="font-size:18px">קישורים</h2><div style="display:grid;gap:8px">
      <button class="btn small ghost" data-copy="${esc(base)}#screen">העתק קישור למסך הגדול</button>
      <button class="btn small ghost" data-copy="${esc(base)}#vote">העתק קישור להצבעה</button>
      <button class="btn small ghost" data-act="codes">העתק את כל הקודים (לשליחה פרטית)</button></div></div>`;

    // משפחות
    h += `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="font-size:18px;margin:0">משפחות וסדר הופעה (${fams.length})</h2><button class="iconbtn" data-act="shuffle">🎲 הגרלת סדר</button></div><div style="display:grid;gap:8px">`;
    fams.forEach((f, i) => {
      const isDone = doneSet.has(f.id), isCur = f.id === st.current;
      h += `<div class="fam-admin ${isCur ? "cur" : ""} ${isDone ? "done" : ""}">
        <div class="row"><b style="min-width:22px">${i + 1}.</b><input data-edit="name" data-id="${f.id}" value="${esc(f.name)}"></div>
        <input data-edit="song" data-id="${f.id}" value="${esc(f.song || "")}" placeholder="שם השיר (לא חובה)">
        <div class="row" style="justify-content:space-between;flex-wrap:wrap">
          <span>קוד: <span class="codechip">${esc(f.code)}</span>${isDone ? " • הופיעו ✓" : ""}${isCur ? " • על הבמה" : ""}</span>
          <span class="row"><button class="iconbtn" data-up="${f.id}">▲</button><button class="iconbtn" data-down="${f.id}">▼</button>
          ${!isCur && st.phase !== "voting" ? `<button class="iconbtn" data-stage="${f.id}">🎤</button>` : ""}
          ${isDone ? `<button class="iconbtn" data-undone="${f.id}">↺</button>` : ""}
          <button class="iconbtn" data-del="${f.id}">🗑</button></span></div></div>`;
    });
    h += `</div><div class="row" style="margin-top:10px"><input id="newFam" placeholder="שם משפחה חדשה" style="flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:15px"><button class="btn small" data-act="add">הוסף</button></div>
      <p class="muted" style="font-size:13px;margin-top:8px">🎤 מעלה משפחה לבמה מחוץ לסדר. ↺ מחזיר משפחה שהופיעה לרשימה (למשל אם היתה תקלה).</p></div>`;

    // תוצאות
    h += `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="font-size:18px;margin:0">תוצאות (רק למנהל)</h2><button class="iconbtn" data-act="toggleRes">${this.showResults ? "הסתר" : "הצג"}</button></div>`;
    if (this.showResults) {
      h += `<table class="res" style="margin-top:10px"><tr><th>#</th><th>משפחה</th><th>נקודות</th><th>מצביעים</th><th>ממוצע</th></tr>` +
        ranking(tree).map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.total}</td><td>${r.count}</td><td>${r.avg.toFixed(2)}</td></tr>`).join("") + `</table>
        <p class="muted" style="font-size:13px;margin-top:8px">הדירוג לפי ממוצע, כדי שמשפחה שחסר לה מצביע לא תיפגע.</p>`;
    }
    h += `</div>`;

    h += `<div class="card"><button class="btn red small" data-act="reset" style="width:100%">איפוס כל ההצבעות וההתקדמות</button><p class="muted" style="font-size:13px;margin-top:8px">המשפחות, השירים והקודים נשמרים. כדאי לאפס אחרי חזרה גנרלית.</p>
      <button class="link" data-act="logout" style="margin-top:10px">יציאה מניהול</button></div></div>`;
    app.innerHTML = h;
    this.bind(tree);
  },
  bind(tree){
    const app = $("#app"); const fams = families(tree); const st = state(tree);
    app.querySelectorAll("[data-edit]").forEach(inp => {
      inp.onfocus = () => this.editing = true;
      inp.onblur = () => { this.editing = false; const v = inp.value.trim(); const f = tree.families[inp.dataset.id]; if (f && (f[inp.dataset.edit] || "") !== v && (v || inp.dataset.edit === "song")) Store.update(`families/${inp.dataset.id}`, { [inp.dataset.edit]: v }); else render(); };
      inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); };
    });
    const move = (id, dir) => { const i = fams.findIndex(f => f.id === id); const j = i + dir; if (j < 0 || j >= fams.length) return; this.reorder(fams.map((f, k) => k === i ? fams[j] : k === j ? fams[i] : f)); };
    app.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(b.dataset.up, -1));
    app.querySelectorAll("[data-down]").forEach(b => b.onclick = () => move(b.dataset.down, 1));
    app.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => this.toStage(b.dataset.stage));
    app.querySelectorAll("[data-undone]").forEach(b => b.onclick = () => Store.remove(`done/${b.dataset.undone}`));
    app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => this.confirm(`למחוק את ${tree.families[b.dataset.del].name}?`, () => { Store.remove(`families/${b.dataset.del}`); Store.remove(`votes/${b.dataset.del}`); }));
    app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => this.copy(b.dataset.copy));
    app.querySelectorAll("[data-act]").forEach(b => b.onclick = () => this.act(b.dataset.act, tree));
  },
  act(a, tree){
    const fams = families(tree); const st = state(tree); const doneSet = new Set(Object.keys(tree.done || {}));
    if (a === "next") { const n = fams.find(f => !doneSet.has(f.id) && f.id !== st.current); if (n) this.toStage(n.id); }
    if (a === "open") Store.update("state", { phase: "voting" });
    if (a === "close") { Store.update("state", { phase: "closed" }); Store.set(`done/${st.current}`, true); }
    if (a === "final") Store.update("state", { phase: "final", current: null });
    if (a === "back") Store.update("state", { phase: "closed" });
    if (a === "reveal") this.confirm("לחשוף עכשיו את הזוכה על המסך הגדול?", () => Store.update("state", { phase: "reveal", revealAt: Date.now() }));
    if (a === "unreveal") Store.update("state", { phase: "final" });
    if (a === "toggleRes") { this.showResults = !this.showResults; render(); }
    if (a === "shuffle") this.confirm("להגריל סדר הופעות חדש?", () => { const arr = fams.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } this.reorder(arr); });
    if (a === "add") { const v = $("#newFam").value.trim(); if (!v) return; const used = new Set(fams.map(f => String(f.code))); const id = "f" + Date.now().toString(36); Store.set(`families/${id}`, { name: v, song: "", code: randCode(used), order: fams.length }); }
    if (a === "codes") this.copy("קודי הצבעה לתחרות הכוכב הבא\n" + location.href.split("#")[0] + "#vote\n\n" + fams.map(f => `${f.name}: ${f.code}`).join("\n"));
    if (a === "reset") this.confirm("לאפס את כל ההצבעות וההתקדמות? אי אפשר לבטל.", () => { Store.remove("votes"); Store.remove("done"); Store.set("state", { phase: "lobby", current: null }); });
    if (a === "logout") { LS.del("kochav-admin"); render(); }
  },
  toStage(id){ Store.update("state", { phase: "performing", current: id }); },
  reorder(arr){ const upd = {}; arr.forEach((f, i) => upd[`${f.id}/order`] = i); Store.update("families", upd).catch(e => toast(e.message)); },
  seed(){
    const used = new Set(); const fam = {};
    INITIAL_FAMILIES.forEach((n, i) => { const c = randCode(used); used.add(c); fam["f" + (i + 1)] = { name: n, song: "", code: c, order: i }; });
    Store.set("families", fam); Store.set("state", { phase: "lobby", current: null });
  },
  copy(text){
    const done = () => toast("הועתק");
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => this.fallbackCopy(text, done)); else this.fallbackCopy(text, done);
  },
  fallbackCopy(text, cb){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); cb(); } catch (e) { toast("לא הצלחתי להעתיק"); } ta.remove(); },
  confirm(msg, yes){
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px";
    d.innerHTML = `<div class="card" style="max-width:380px;width:100%;background:#0b1640"><p style="font-size:18px;margin-bottom:16px">${esc(msg)}</p><div class="grid2"><button class="btn" id="cy">כן</button><button class="btn ghost" id="cn">ביטול</button></div></div>`;
    document.body.appendChild(d);
    d.querySelector("#cy").onclick = () => { d.remove(); yes(); };
    d.querySelector("#cn").onclick = () => d.remove();
  }
};

/* ===================== קונפטי ===================== */
let confettiRAF = null;
function startConfetti(){
  const c = $("#confetti"); const ctx = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const colors = ["#f5c96a", "#fff3c9", "#5aa8ff", "#ffffff", "#d99a2b"];
  const parts = Array.from({ length: 220 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height, r: 4 + Math.random() * 7, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, a: Math.random() * 6, va: -.1 + Math.random() * .2, col: colors[Math.floor(Math.random() * colors.length)] }));
  cancelAnimationFrame(confettiRAF);
  (function tick(){
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += p.va; if (p.y > c.height + 20) { p.y = -20; p.x = Math.random() * c.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    confettiRAF = requestAnimationFrame(tick);
  })();
}
function stopConfetti(){ cancelAnimationFrame(confettiRAF); const c = $("#confetti"); c.getContext("2d").clearRect(0, 0, c.width, c.height); }

render();
</script>
